  <path d="M270 266 H312 V318 H270 Z" fill="#E8C6A8" class="ink"/>
  <!-- sweater / torso -->
  <path d="M138 470 C138 372 196 322 291 316 C386 322 444 372 444 470 Z" fill="#1B5E43" class="ink"/>
  <path d="M262 318 C270 342 312 342 320 318" fill="#E8C6A8" class="ink"/>
  <path d="M170 440 C180 400 200 372 226 352" fill="none" stroke="#2E8F63" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <!-- arms -->
  <path d="M206 366 C170 400 166 440 220 482" fill="none" stroke="#061F16" stroke-width="44" stroke-linecap="round"/>
  <path d="M206 366 C170 400 166 440 220 482" fill="none" stroke="#2E8F63" stroke-width="37" stroke-linecap="round"/>
  <path d="M380 366 C420 402 424 446 372 486" fill="none" stroke="#061F16" stroke-width="44" stroke-linecap="round"/>
  <path d="M380 366 C420 402 424 446 372 486" fill="none" stroke="#2E8F63" stroke-width="37" stroke-linecap="round"/>
  <!-- face -->
  <ellipse cx="291" cy="200" rx="63" ry="76" fill="#F4D9C2" class="ink"/>
  <!-- hair fringe + front curtains -->
  <path d="M226 196 C222 126 262 104 294 104 C336 104 364 136 358 196 C342 160 316 146 290 148 C262 150 240 166 226 196 Z" fill="#A95A33" class="ink"/>
  <path d="M226 190 C214 250 208 330 192 428 Q198 448 218 442 Q238 438 240 422 C244 350 246 270 246 206 Z" fill="#A95A33" class="ink"/>
  <path d="M358 190 C370 250 376 330 392 428 Q386 448 366 442 Q346 438 344 422 C340 350 338 270 336 206 Z" fill="#A95A33" class="ink"/>
  <!-- glasses -->
  <g fill="rgba(255,255,255,.28)" stroke="#3B2417" stroke-width="4.5" stroke-linejoin="round">
    <rect x="248" y="184" width="36" height="30" rx="12"/><rect x="299" y="184" width="36" height="30" rx="12"/>
  </g>
  <path d="M284 196 H299" stroke="#3B2417" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M248 194 L238 190 M335 194 L345 190" stroke="#3B2417" stroke-width="4" stroke-linecap="round"/>
  <circle cx="266" cy="199" r="3.6" fill="#061F16"/><circle cx="317" cy="199" r="3.6" fill="#061F16"/>
  <path d="M252 177 Q266 171 280 176 M303 176 Q317 171 331 177" fill="none" stroke="#7B3F22" stroke-width="3.5" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M264 234 Q291 262 320 234 Q291 244 264 234 Z" fill="#fff" class="thin"/>
  <path d="M274 226 q4 2 8 0" fill="none" stroke="none"/>
  <path d="M291 214 q-4 8 0 10" fill="none" stroke="#C99572" stroke-width="3" stroke-linecap="round"/>
  <circle cx="254" cy="228" r="9" fill="#EFA990" opacity=".45"/><circle cx="329" cy="228" r="9" fill="#EFA990" opacity=".45"/>

  <!-- desk -->
  <path d="M-10 456 H610 V610 H-10 Z" fill="#2E8F63" class="ink"/>
  <path d="M10 480 H190 M260 590 H420 M470 488 H590 M30 570 H150" stroke="#1B5E43" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- notebook -->
  <g class="ink">
    <path d="M118 520 L268 498 L268 560 L112 580 Z" fill="#F2F8EE"/>
    <path d="M268 498 L418 520 L424 580 L268 560 Z" fill="#E4EFE0"/>
  </g>
  <g stroke="#9BB8A6" stroke-width="2.5" stroke-linecap="round">
    <path d="M136 530 L250 514 M134 542 L250 526 M132 554 L248 538"/><path d="M288 514 L400 532 M288 526 L402 544 M288 538 L404 556"/>
  </g>
  <path d="M268 498 V560" stroke="#061F16" stroke-width="3"/>
  <!-- hands + pen -->
  <ellipse cx="226" cy="494" rx="22" ry="17" fill="#F4D9C2" class="ink"/>
  <path d="M214 490 Q226 480 240 490" fill="none" stroke="#C99572" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M236 486 L274 540" stroke="#061F16" stroke-width="9" stroke-linecap="round"/>
  <path d="M236 486 L274 540" stroke="#D6F24B" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="368" cy="494" rx="24" ry="16" fill="#F4D9C2" class="ink"/>

  <!-- laptop -->
  <g class="ink">
    <path d="M444 372 L596 380 L590 478 L440 480 Z" fill="#061F16"/>
    <path d="M426 482 L604 482 L592 506 L440 506 Z" fill="#CFE9D6"/>
  </g>
  <g>
    <path d="M452 382 L520 385 L518 424 L450 422 Z" fill="#D6F24B" class="thin"/><path d="M524 385 L588 388 L586 426 L522 424 Z" fill="#2E8F63" class="thin"/>
    <path d="M450 428 L518 429 L516 468 L448 467 Z" fill="#CFE9D6" class="thin"/><path d="M522 429 L586 430 L584 468 L520 468 Z" fill="#1B5E43" class="thin"/>
    <g class="thin"><circle cx="485" cy="400" r="9" fill="#F4D9C2"/><circle cx="555" cy="404" r="9" fill="#E8C6A8"/><circle cx="483" cy="445" r="9" fill="#F4D9C2"/><circle cx="553" cy="447" r="9" fill="#E8C6A8"/></g>
    <g class="thin"><path d="M468 424 q17 -16 34 0 Z" fill="#061F16"/><path d="M538 426 q17 -16 34 0 Z" fill="#CFE9D6"/><path d="M466 466 q17 -16 34 0 Z" fill="#D6F24B"/><path d="M536 468 q17 -16 34 0 Z" fill="#CFE9D6"/></g>
  </g>

  <!-- mug -->
  <g class="ink">
    <path d="M42 470 H92 L88 512 H46 Z" fill="#D6F24B"/>
    <path d="M92 478 C112 478 112 502 90 502" fill="none" stroke-width="6"/>
    <ellipse cx="67" cy="470" rx="25" ry="6" fill="#0F3D2C"/>
  </g>
  <g class="steam" fill="none" stroke="#CFE9D6" stroke-width="3.5" stroke-linecap="round"><path d="M56 454 q-6 -10 0 -18 q6 -8 0 -16"/><path d="M76 454 q-6 -10 0 -18 q6 -8 0 -16"/></g>

  <!-- books, front right -->
  <g class="ink">
    <path d="M470 522 L600 522 L600 548 L466 548 Z" fill="#1B5E43"/><path d="M470 522 H600 V532 H470 Z" fill="#CFE9D6"/>
    <path d="M482 548 L600 548 L600 574 L478 574 Z" fill="#D6F24B"/><path d="M482 548 H600 V558 H482 Z" fill="#CFE9D6"/>
  </g>

  <!-- sparkles -->
  <g fill="#D6F24B" class="thin"><path d="M168 84 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/><path d="M420 64 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/></g>
</svg>
