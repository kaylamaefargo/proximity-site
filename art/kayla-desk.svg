<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
  <title id="t">Kayla Fargo at her desk</title>
  <desc id="d">Illustration of Kayla Fargo, smiling, with long auburn hair and glasses, writing in a notebook at a desk. A laptop beside her shows a video call with four people, and plants and bookshelves fill the room.</desc>
  <style>
    .ink{stroke:#061F16;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
    .thin{stroke:#061F16;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
    .steam{animation:steam 3s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
    @keyframes steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.sway,.steam{animation:none}}
  </style>

  <!-- room -->
  <rect width="600" height="600" fill="#0F3D2C"/>
  <circle cx="300" cy="232" r="205" fill="#D6F24B" class="ink"/>
  <circle cx="300" cy="232" r="168" fill="none" stroke="#B4D132" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- big plant, right -->
  <g class="sway">
    <path d="M520 420 C522 330 512 250 505 140" fill="none" class="ink" stroke-width="5"/>
    <path d="M520 420 C535 340 560 260 585 190" fill="none" class="ink" stroke-width="5"/>
    <path d="M520 420 C500 350 468 290 440 232" fill="none" class="ink" stroke-width="5"/>
    <g class="ink">
      <path d="M505 140 C470 118 462 78 480 52 C515 62 536 100 505 140 Z" fill="#2E8F63"/>
      <path d="M585 190 C560 150 580 112 610 106 C620 140 612 172 585 190 Z" fill="#CFE9D6"/>
      <path d="M440 232 C400 222 384 186 396 156 C436 160 462 196 440 232 Z" fill="#CFE9D6"/>
      <path d="M512 268 C556 262 580 232 574 206 C534 206 504 232 512 268 Z" fill="#2E8F63"/>
      <path d="M502 300 C458 300 430 270 436 244 C478 246 510 270 502 300 Z" fill="#1B5E43"/>
    </g>
    <path d="M505 140 L492 76 M585 190 L598 118 M440 232 L416 170" stroke="#061F16" stroke-width="2.5" fill="none" opacity=".5"/>
  </g>
  <path d="M478 405 H562 L554 462 H486 Z" fill="#CFE9D6" class="ink"/>

  <!-- shelves, left -->
  <g>
    <rect x="-10" y="168" width="168" height="12" fill="#CFE9D6" class="ink"/>
    <rect x="-10" y="306" width="168" height="12" fill="#CFE9D6" class="ink"/>
    <!-- trailing plant on top shelf -->
    <path d="M48 168 L56 138 H96 L102 168 Z" fill="#D6F24B" class="ink"/>
    <g class="ink">
      <path d="M74 138 C64 112 80 92 96 88 C104 108 94 128 74 138 Z" fill="#2E8F63"/>
      <path d="M72 138 C52 128 44 106 52 94 C70 100 82 118 72 138 Z" fill="#CFE9D6"/>
      <path d="M86 140 C108 136 122 118 120 104 C100 106 86 122 86 140 Z" fill="#2E8F63"/>
      <path d="M52 154 C34 170 30 196 36 214 C50 198 56 176 52 154 Z" fill="#CFE9D6"/>
      <path d="M100 160 C118 176 124 204 118 222 C102 204 96 182 100 160 Z" fill="#2E8F63"/>
    </g>
    <!-- picture frame -->
    <rect x="26" y="188" width="82" height="58" fill="#F2F8EE" class="ink"/>
    <rect x="35" y="196" width="64" height="42" fill="#0F3D2C" class="thin"/>
    <path d="M35 238 L54 212 L66 225 L80 206 L99 238 Z" fill="#2E8F63" class="thin"/>
    <circle cx="85" cy="209" r="5.5" fill="#D6F24B"/>
    <!-- books on lower shelf -->
    <g class="ink">
      <rect x="6" y="262" width="16" height="44" fill="#CFE9D6"/><rect x="24" y="256" width="18" height="50" fill="#2E8F63"/>
      <rect x="44" y="268" width="14" height="38" fill="#D6F24B"/><rect x="60" y="258" width="20" height="48" fill="#1B5E43"/>
      <rect x="82" y="266" width="15" height="40" fill="#CFE9D6"/><rect x="99" y="256" width="17" height="50" fill="#2E8F63"/>
      <rect x="118" y="270" width="28" height="36" fill="#D6F24B"/>
    </g>
    <!-- lower row of books on a third ledge -->
    <rect x="-10" y="404" width="168" height="12" fill="#CFE9D6" class="ink"/>
    <g class="ink">
      <rect x="4" y="352" width="20" height="52" fill="#1B5E43"/><rect x="26" y="364" width="16" height="40" fill="#D6F24B"/>
      <rect x="44" y="346" width="22" height="58" fill="#CFE9D6"/><rect x="68" y="358" width="18" height="46" fill="#2E8F63"/>
      <rect x="88" y="350" width="16" height="54" fill="#D6F24B"/><rect x="106" y="362" width="22" height="42" fill="#1B5E43"/>
    </g>
  </g>

