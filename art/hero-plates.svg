<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">One person keeping eight marketing programs spinning at once</title>
  <desc id="d">An illustrated figure spins plates on poles, each plate labeled with a marketing program: brand, organic, social, paid, events, email, CRM and launch.</desc>
  <style>
    .ink{stroke:#061F16;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .pole{stroke:#CFE9D6;stroke-width:5;stroke-linecap:round}
    .tag{font:800 9.5px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;fill:#061F16;text-anchor:middle}
    .spin{transform-box:fill-box;transform-origin:center;animation:wob 2.6s ease-in-out infinite}
    .s2{animation-delay:-.4s}.s3{animation-delay:-.9s}.s4{animation-delay:-1.3s}.s5{animation-delay:-1.8s}.s6{animation-delay:-2.2s}.s7{animation-delay:-.7s}
    @keyframes wob{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  </style>

  <!-- floor -->
  <path d="M10 442 H630" stroke="#CFE9D6" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity=".55"/>

  <!-- stands + poles (x, top y) -->
  <g class="pole">
    <path d="M50 440 V190"/><path d="M125 440 V130"/><path d="M200 440 V210"/>
    <path d="M440 440 V220"/><path d="M515 440 V140"/><path d="M590 440 V200"/>
  </g>
  <g class="ink" fill="#2E8F63">
    <path d="M30 442 L50 420 L70 442 Z"/><path d="M105 442 L125 420 L145 442 Z"/><path d="M180 442 L200 420 L220 442 Z"/>
    <path d="M420 442 L440 420 L460 442 Z"/><path d="M495 442 L515 420 L535 442 Z"/><path d="M570 442 L590 420 L610 442 Z"/>
  </g>

  <!-- the person -->
  <g class="ink">
    <!-- held poles -->
    <path d="M290 300 V110" stroke="#CFE9D6" stroke-width="5" fill="none"/>
    <path d="M350 300 V170" stroke="#CFE9D6" stroke-width="5" fill="none"/>
    <!-- legs -->
    <path d="M308 392 L296 440" fill="none" stroke-width="12"/><path d="M332 392 L350 440" fill="none" stroke-width="12"/>
    <path d="M308 392 L296 440" fill="none" stroke="#0F3D2C" stroke-width="7"/><path d="M332 392 L350 440" fill="none" stroke="#0F3D2C" stroke-width="7"/>
    <ellipse cx="290" cy="440" rx="15" ry="6" fill="#D6F24B"/><ellipse cx="357" cy="440" rx="15" ry="6" fill="#D6F24B"/>
    <!-- arms -->
    <path d="M304 346 L290 300" fill="none" stroke-width="12"/><path d="M336 346 L350 300" fill="none" stroke-width="12"/>
    <path d="M304 346 L290 300" fill="none" stroke="#2E8F63" stroke-width="7"/><path d="M336 346 L350 300" fill="none" stroke="#2E8F63" stroke-width="7"/>
    <circle cx="290" cy="297" r="8" fill="#CFE9D6"/><circle cx="350" cy="297" r="8" fill="#CFE9D6"/>
    <!-- torso -->
    <path d="M298 340 Q320 330 342 340 L346 396 Q320 404 294 396 Z" fill="#2E8F63"/>
    <path d="M308 346 H332" stroke="#D6F24B" stroke-width="5" fill="none"/>
    <!-- head -->
    <circle cx="320" cy="312" r="24" fill="#CFE9D6"/>
    <path d="M297 308 Q304 282 326 286 Q344 290 343 308 Q330 296 297 308 Z" fill="#061F16"/>
    <circle cx="311" cy="316" r="2.6" fill="#061F16" stroke="none"/><circle cx="329" cy="316" r="2.6" fill="#061F16" stroke="none"/>
    <path d="M312 325 Q320 331 328 325" fill="none" stroke-width="2.5"/>
  </g>

  <!-- plates: group origin is the pole tip -->
  <g id="plates">
    <g class="spin s1"><g transform="translate(50 190)"><rect x="-27" y="22" width="54" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">BRAND</text><ellipse rx="45" ry="13" fill="#D6F24B" class="ink"/><ellipse rx="29" ry="6.5" fill="#B4D132"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s2"><g transform="translate(125 130)"><rect x="-31" y="22" width="62" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">ORGANIC</text><ellipse rx="45" ry="13" fill="#CFE9D6" class="ink"/><ellipse rx="29" ry="6.5" fill="#9FCDB0"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s3"><g transform="translate(200 210)"><rect x="-27" y="22" width="54" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">SOCIAL</text><ellipse rx="45" ry="13" fill="#D6F24B" class="ink"/><ellipse rx="29" ry="6.5" fill="#B4D132"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s4"><g transform="translate(290 110)"><rect x="-22" y="22" width="44" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">PAID</text><ellipse rx="45" ry="13" fill="#CFE9D6" class="ink"/><ellipse rx="29" ry="6.5" fill="#9FCDB0"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s5"><g transform="translate(350 170)"><rect x="-28" y="22" width="56" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">EVENTS</text><ellipse rx="45" ry="13" fill="#D6F24B" class="ink"/><ellipse rx="29" ry="6.5" fill="#B4D132"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s6"><g transform="translate(440 220)"><rect x="-25" y="22" width="50" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">EMAIL</text><ellipse rx="45" ry="13" fill="#CFE9D6" class="ink"/><ellipse rx="29" ry="6.5" fill="#9FCDB0"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s7"><g transform="translate(515 140)"><rect x="-20" y="22" width="40" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">CRM</text><ellipse rx="45" ry="13" fill="#D6F24B" class="ink"/><ellipse rx="29" ry="6.5" fill="#B4D132"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
    <g class="spin s2"><g transform="translate(590 200)"><rect x="-29" y="22" width="58" height="17" rx="3" fill="#CFE9D6" class="ink"/><text class="tag" y="34.5">LAUNCH</text><ellipse rx="45" ry="13" fill="#CFE9D6" class="ink"/><ellipse rx="29" ry="6.5" fill="#9FCDB0"/><path d="M-12 -3 Q0 -9 12 -3" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8" stroke-linecap="round"/></g></g>
  </g>

  <!-- sparkles -->
  <g fill="#D6F24B" class="ink" stroke-width="2"><path d="M395 70 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z"/><path d="M215 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/><path d="M600 90 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/></g>
</svg>
