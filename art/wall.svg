<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
  <title id="t">A wall between teams, with a hole knocked through it</title>
  <desc id="d">A brick wall separates marketing and sales on the left from product and customer success on the right. Bricks are falling out of the middle, leaving a gap everyone can see through.</desc>
  <style>
    .ink{stroke:#061F16;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .lab{font:800 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.12em;text-anchor:middle}
    .fall{animation:fall 3.2s ease-in infinite}
    .f2{animation-delay:-1.1s}.f3{animation-delay:-2.1s}
    @keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(70px) rotate(24deg);opacity:0}}
    @media (prefers-reduced-motion:reduce){.fall{animation:none;opacity:1}}
  </style>
  <path d="M0 290 H600" stroke="#CFE9D6" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity=".55"/>
  <!-- wall: rows of bricks with a hole in the middle -->
  <g class="ink" fill="#2E8F63">
    <!-- row 1 (y=30) -->
    <rect x="200" y="30" width="50" height="26" rx="2"/><rect x="254" y="30" width="50" height="26" rx="2" fill="#1B5E43"/><rect x="308" y="30" width="50" height="26" rx="2"/><rect x="362" y="30" width="38" height="26" rx="2" fill="#1B5E43"/>
    <!-- row 2 (y=60) -->
    <rect x="200" y="60" width="26" height="26" rx="2" fill="#1B5E43"/><rect x="230" y="60" width="50" height="26" rx="2"/><rect x="332" y="60" width="50" height="26" rx="2" fill="#1B5E43"/><rect x="386" y="60" width="14" height="26" rx="2"/>
    <!-- row 3 (y=90) -->
    <rect x="200" y="90" width="50" height="26" rx="2"/><rect x="358" y="90" width="42" height="26" rx="2"/>
    <!-- row 4 (y=120): hole -->
    <rect x="200" y="120" width="26" height="26" rx="2" fill="#1B5E43"/><rect x="374" y="120" width="26" height="26" rx="2" fill="#1B5E43"/>
    <!-- rows 5-8 intact low (y=150..) but broken at the middle -->
    <rect x="200" y="150" width="50" height="26" rx="2"/><rect x="254" y="150" width="30" height="26" rx="2" fill="#1B5E43"/><rect x="336" y="150" width="64" height="26" rx="2"/>
    <rect x="200" y="180" width="26" height="26" rx="2" fill="#1B5E43"/><rect x="230" y="180" width="50" height="26" rx="2"/><rect x="284" y="180" width="50" height="26" rx="2" fill="#1B5E43"/><rect x="338" y="180" width="62" height="26" rx="2"/>
    <rect x="200" y="210" width="50" height="26" rx="2"/><rect x="254" y="210" width="50" height="26" rx="2" fill="#1B5E43"/><rect x="308" y="210" width="50" height="26" rx="2"/><rect x="362" y="210" width="38" height="26" rx="2" fill="#1B5E43"/>
    <rect x="200" y="240" width="26" height="26" rx="2" fill="#1B5E43"/><rect x="230" y="240" width="50" height="26" rx="2"/><rect x="284" y="240" width="50" height="26" rx="2" fill="#1B5E43"/><rect x="338" y="240" width="62" height="26" rx="2"/>
    <rect x="200" y="270" width="50" height="20" rx="2"/><rect x="254" y="270" width="50" height="20" rx="2" fill="#1B5E43"/><rect x="308" y="270" width="50" height="20" rx="2"/><rect x="362" y="270" width="38" height="20" rx="2" fill="#1B5E43"/>
  </g>
  <!-- falling bricks -->
  <g class="ink" fill="#D6F24B">
    <rect class="fall" x="270" y="108" width="46" height="24" rx="2"/>
    <rect class="fall f2" x="318" y="124" width="40" height="24" rx="2"/>
    <rect class="fall f3" x="236" y="132" width="34" height="22" rx="2"/>
  </g>
  <!-- the two sides -->
  <g class="ink">
    <circle cx="70" cy="226" r="20" fill="#CFE9D6"/><rect x="50" y="244" width="40" height="46" rx="14" fill="#D6F24B"/>
    <circle cx="140" cy="236" r="18" fill="#CFE9D6"/><rect x="122" y="252" width="36" height="38" rx="13" fill="#2E8F63"/>
    <circle cx="460" cy="236" r="18" fill="#CFE9D6"/><rect x="442" y="252" width="36" height="38" rx="13" fill="#2E8F63"/>
    <circle cx="530" cy="226" r="20" fill="#CFE9D6"/><rect x="510" y="244" width="40" height="46" rx="14" fill="#D6F24B"/>
  </g>
  <rect x="30" y="170" width="86" height="22" rx="4" fill="#CFE9D6" class="ink"/><text class="lab" x="73" y="185" fill="#061F16">MARKETING</text>
  <rect x="104" y="196" width="72" height="22" rx="4" fill="#D6F24B" class="ink"/><text class="lab" x="140" y="211" fill="#061F16">SALES</text>
  <rect x="424" y="196" width="72" height="22" rx="4" fill="#D6F24B" class="ink"/><text class="lab" x="460" y="211" fill="#061F16">PRODUCT</text>
  <rect x="484" y="170" width="86" height="22" rx="4" fill="#CFE9D6" class="ink"/><text class="lab" x="527" y="185" fill="#061F16">SUCCESS</text>
</svg>
